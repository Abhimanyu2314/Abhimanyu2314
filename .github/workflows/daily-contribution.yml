name: Daily Contribution Matrix

'on':
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Daily Telemetry Log
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > LAST_UPDATED

      - name: Commit and Push changes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add LAST_UPDATED
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated daily telemetry update" && git push)
